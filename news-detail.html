<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>推文详情 - 逐浪智用社</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .article-container {
            max-width: 800px; margin: 100px auto 50px auto; padding: 40px;
            background: rgba(20, 30, 50, 0.8); backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 255, 255, 0.3); border-radius: 12px;
            color: #d4d4d4; position: relative; z-index: 10;
        }
        .back-btn { display: inline-block; margin-bottom: 20px; color: #00ffff; text-decoration: none; font-weight: bold; position: relative; z-index: 99; }
        .article-title { color: #fff; text-shadow: 0 0 20px rgba(0, 255, 255, 0.8); font-size: 36px; margin-bottom: 10px; line-height: 1.3; }
        .article-meta { color: #888; font-size: 14px; margin-bottom: 30px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 15px; }
        .article-cover { width: 100%; max-height: 400px; object-fit: cover; border-radius: 8px; margin-bottom: 30px; border: 1px solid #333; }
        /* 文章正文排版，极其舒适 */
        .article-content { line-height: 1.8; font-size: 16px; color: #d4d4d4; white-space: pre-wrap; word-wrap: break-word; }
        .article-content p { margin-bottom: 15px; }
        .article-content h3 { color: #00ffff; margin-top: 30px; margin-bottom: 15px; }
        .article-content img { max-width: 100%; border-radius: 8px; margin: 15px 0; }
    </style>
</head>
<body>
    <div class="article-container">
        <a href="gallery.html" class="back-btn">← 返回社团风采</a >
        <div id="loading" style="text-align: center;">正在加载文章...</div>

        <div id="article-content-area" style="display: none;">
            <h1 id="n-title" class="article-title"></h1>
            <div class="article-meta">
                <span>📅 发布时间：<span id="n-date"></span></span>
            </div>
            <img id="n-cover" class="article-cover" src="" alt="封面">
            <div id="n-content" class="article-content"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const isLocal = window.location.hostname === '127.0.0.1' || window.location.hostname === 'localhost';
const supabaseUrl = isLocal ? 'https://jjsjpqrgdclczhujkgpc.supabase.co' : window.location.origin + '/supabase';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Impqc2pwcXJnZGNsY3podWprZ3BjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMwNzMxMDMsImV4cCI6MjEwODY0OTEwM30.xvF8oOQOGk4mu3_WlYGEEZxKKs-aLyiunugF6xuJRQw'; // ⚠️ 换成你的Key
        const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

        // 获取 URL 中的推文 id
        const urlParams = new URLSearchParams(window.location.search);
        const newsId = urlParams.get('id');

        async function loadArticle() {
            if (!newsId) {
                document.getElementById('loading').innerText = '找不到该文章，请检查链接。';
                return;
            }

            // 从 news 表里精准拉取这一条数据
            const { data, error } = await supabaseClient
                .from('news')
                .select('*')
                .eq('id', newsId)
                .single();

            if (error || !data) {
                document.getElementById('loading').innerText = '文章加载失败，可能已被删除。';
                return;
            }

            document.getElementById('loading').style.display = 'none';
            document.getElementById('article-content-area').style.display = 'block';

            if (data.cover_url) {
                document.getElementById('n-cover').src = data.cover_url;
            } else {
                document.getElementById('n-cover').style.display = 'none';
            }

            document.getElementById('n-title').innerText = data.title;
            document.getElementById('n-date').innerText = data.date_str || '最新';
            
            // ⚠️ 关键：用 innerHTML 渲染正文，这样干事如果在后台写了 HTML 标签也能生效！
            document.getElementById('n-content').innerHTML = data.content;
        }

        loadArticle();
    </script>
</body>
</html>
