        .resource-list { list-style: none; padding: 0; }
        .resource-list li { background: rgba(255,255,255,0.05); margin-bottom: 15px; padding: 15px; border-radius: 8px; border-left: 3px solid #00ffff; }
        .resource-list a { color: #00ffff; text-decoration: none; }
