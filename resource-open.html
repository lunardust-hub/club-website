<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>开源分享 - 逐浪智用社</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .content-container {
            max-width: 800px; margin: 120px auto 50px auto;
            background: rgba(20, 30, 50, 0.7); backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 255, 255, 0.3); border-radius: 10px;
            padding: 40px; color: #d4d4d4; position: relative; z-index: 10;
        }
        .content-container h1 { color: #fff; text-shadow: 0 0 20px rgba(0, 255, 255, 0.8); margin-bottom: 20px; text-align: center; }
        .back-btn { display: inline-block; margin-bottom: 20px; color: #00ffff; text-decoration: none; font-weight: bold; }
        .back-btn:hover { text-shadow: 0 0 10px #00ffff; }
        .resource-list { list-style: none; padding: 0; }
        .resource-list li { background: rgba(255,255,255,0.05); margin-bottom: 15px; padding: 15px; border-radius: 8px; border-left: 3px solid #00ffff; }
        .resource-list a { color: #00ffff; text-decoration: none; }
    </style>
</head>
<body>
    <div class="header"><div class="logo">逐浪智用社</div></div>
    
    <div class="content-container" style="max-width: 900px; margin: 120px auto; padding: 40px; position: relative; z-index: 10;">
        <a href="index.html" class="back-btn" style="color: #00ffff; text-decoration: none; font-size: 18px;">← 返回首页</a >
        <h1 style="color: #fff; text-shadow: 0 0 20px rgba(0, 255, 255, 0.8); text-align: center; margin-bottom: 40px; font-size: 36px;">开源分享资源库</h1>
        
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 25px;">
            
            <!-- 分类 1：AI 工具导航 -->
            <a href="category.html?cat=ai" style="text-decoration: none;">
                <div style="background: rgba(20, 30, 50, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(0, 255, 255, 0.3); border-radius: 15px; padding: 40px 20px; text-align: center; transition: 0.3s; height: 100%; box-sizing: border-box;" onmouseover="this.style.transform='translateY(-5px)'; this.style.boxShadow='0 0 20px rgba(0,255,255,0.3)'" onmouseout="this.style.transform='translateY(0)'; this.style.boxShadow='none'">
                    <div style="font-size: 50px; margin-bottom: 15px;">🤖</div>
                    <h2 style="color: #fff; font-size: 24px; margin-bottom: 10px;">AI 工具导航</h2>
                    <p style="color: #a1a1aa; font-size: 14px;">汇聚大家分享的实用 AI 软件与提效技巧</p >
                </div>
            </a >

            <!-- 分类 2：学习资源分享 -->
            <a href="category.html?cat=study" style="text-decoration: none;">
                <div style="background: rgba(20, 30, 50, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(0, 255, 255, 0.3); border-radius: 15px; padding: 40px 20px; text-align: center; transition: 0.3s; height: 100%; box-sizing: border-box;" onmouseover="this.style.transform='translateY(-5px)'; this.style.boxShadow='0 0 20px rgba(0,255,255,0.3)'" onmouseout="this.style.transform='translateY(0)'; this.style.boxShadow='none'">
                    <div style="font-size: 50px; margin-bottom: 15px;">📚</div>
                    <h2 style="color: #fff; font-size: 24px; margin-bottom: 10px;">学习资源分享</h2>
                    <p style="color: #a1a1aa; font-size: 14px;">期末真题、复习笔记与大家整理的干货</p >
                </div>
            </a >

            <!-- 分类 3：GitHub 社群 -->
            <a href="category.html?cat=github" style="text-decoration: none;">
                <div style="background: rgba(20, 30, 50, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(0, 255, 255, 0.3); border-radius: 15px; padding: 40px 20px; text-align: center; transition: 0.3s; height: 100%; box-sizing: border-box;" onmouseover="this.style.transform='translateY(-5px)'; this.style.boxShadow='0 0 20px rgba(0,255,255,0.3)'" onmouseout="this.style.transform='translateY(0)'; this.style.boxShadow='none'">
                    <div style="font-size: 50px; margin-bottom: 15px;">🐙</div>
                    <h2 style="color: #fff; font-size: 24px; margin-bottom: 10px;">GitHub 社群</h2>
                    <p style="color: #a1a1aa; font-size: 14px;">社员们的开源项目与个人主页集锦</p >
                </div>
            </a >

        </div>
    </div>
</body>
</html>
