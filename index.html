<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>逐浪智用社</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      margin: 0;
      font-family: 'Arial', sans-serif;
/* 深邃暗夜底色 */
background-color: #050814;
 /* 使用本地图片作为背景，并叠加一层深色遮罩保证文字清晰 */
  background-image: url('bg.jpg');
  background-size: cover;
  background-position: center;
  background-attachment: fixed;
  
  color: #f8fafc;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px;
      backdrop-filter: blur(10px);
      background-color: rgba(5, 8, 20, 0.8);
    }
    .logo {
      font-size: 24px;
      font-weight: bold;
      color: #61dafb;
    }
    .nav-links {
      display: flex;
    }
    .nav-link {
      color: #d4d4d4;
      margin-left: 20px;
      text-decoration: none;
      font-size: 16px;
    }
    .nav-link:hover {
      color: #61dafb;
    }
    .hero {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: transparent;
    }
    .hero h1 {
      font-size: 48px;
      margin: 0;
      text-shadow: 0 0 20px rgba(0, 255, 255, 0.8);
    }
    .hero p {
      font-size: 24px;
      margin: 20px 0;
    }
    .project-section {
      padding: 40px;
      background-color: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(12px);
      border-radius: 10px;
      padding: 20px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .project-title {
      font-size: 32px;
      text-align: center;
      margin-bottom: 20px;
      text-shadow: 0 0 20px rgba(0, 255, 255, 0.8);
    }
    .project-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
      padding: 20px;
    }
    .project-card {
      background-color: rgba(15, 23, 42, 0.7) !important;
      backdrop-filter: blur(12px);
      border-radius: 10px;
      padding: 20px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .project-card:hover {
      transform: scale(1.02);
      box-shadow: 0 0 20px rgba(0, 255, 255, 0.4);
    }
    .project-card h3 {
      margin: 10px 0;
      color: #ffffff;
    }
    .project-card p {
      margin: 0;
      color: #94a3b8;
    }
    .footer {
      text-align: center;
      padding: 20px;
      background-color: #1c1c1c;
      color: #d4d4d4;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">逐浪智用社</div>
    <div class="nav-links">
      <a href="#about" class="nav-link">关于我们</a>
      <a href="#projects" class="nav-link">项目展示</a>
      <a href="#team" class="nav-link">团队成员</a>
    </div>
  </div>
  <div class="hero">
    <h1>用开源与AI，打破信息差</h1>
    <p>山东大学 · 科技与创新社团</p>
  </div>
  <div class="project-section" id="projects">
    <h2 class="project-title">项目与活动</h2>
    <div class="project-grid">
      <div class="project-card">
        <h3>开源分享</h3>
        <p>分享最新的开源工具和资源，帮助大家更好地使用和了解AI和开源技术。</p>
      </div>
      <div class="project-card">
        <h3>比赛</h3>
        <p>组织成员参与各类技术竞赛，在实战中提升团队的技术水平与创新能力。</p>
      </div>
      <div class="project-card">
        <h3>技术研讨会</h3>
        <p>定期举办技术研讨会，邀请行业专家分享最新的技术趋势和实战经验。</p>
      </div>
      <div class="project-card">
        <h3>项目协作</h3>
        <p>提供一个协作平台，让团队成员可以共同开发和维护开源项目。</p>
      </div>
    </div>
  </div>
  <!-- 完整的报名表单区 -->
<section class="register-section" style="padding: 40px 20px; text-align: center; position: relative; z-index: 10;">
  <h2 style="color: #fff; text-shadow: 0 0 20px rgba(0, 255, 255, 0.8); margin-bottom: 20px;">加入我们</h2>
  <form id="registerForm" style="background: rgba(20, 30, 50, 0.6); backdrop-filter: blur(12px); border: 1px solid rgba(0, 255, 255, 0.3); padding: 30px; border-radius: 10px; max-width: 400px; margin: 0 auto; display: flex; flex-direction: column; gap: 15px; text-align: left;">
    
    <label style="color: #fff;">姓名</label>
    <input type="text" id="name" required style="padding: 10px; border-radius: 5px; border: 1px solid #555; background: rgba(255,255,255,0.1); color: #fff;">
    
    <label style="color: #fff;">年级/专业</label>
    <input type="text" id="major" required style="padding: 10px; border-radius: 5px; border: 1px solid #555; background: rgba(255,255,255,0.1); color: #fff;">
    
    <label style="color: #fff;">意向部门</label>
    <select id="department" style="padding: 10px; border-radius: 5px; border: 1px solid #555; background: rgba(255,255,255,0.1); color: #fff;">
      <option value="技术部" style="color: black;">技术部</option>
      <option value="宣传部" style="color: black;">宣传部</option>
      <option value="文体部" style="color: black;">文体部</option>
      <option value="外联部" style="color: black;">外联部</option>
      <option value="学习部" style="color: black;">学习部</option>
    </select>
    
    <button type="submit" style="margin-top: 10px; padding: 12px; background: #00ffff; color: #000; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; box-shadow: 0 0 10px rgba(0, 255, 255, 0.5);">提交报名</button>
  </form>
</section>
  <div class="footer">
    &copy; 2026 逐浪智用社. 版权所有.
  </div>
<script>
  const supabaseUrl = 'https://jjsjpqrgdclczhujkgpc.supabase.co';
  const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Impqc2pwcXJnZGNsY3podWprZ3BjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMwNzMxMDMsImV4cCI6MjEwODY0OTEwM30.xvF8oOQOGk4mu3_WlYGEEZxKKs-aLyiunugF6xuJRQw';
  const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

  document.getElementById('registerForm').addEventListener('submit', async (e) => {
    e.preventDefault(); 
    const name = document.getElementById('name').value;
    const major = document.getElementById('major').value;
    const department = document.getElementById('department').value;

    const { data, error } = await supabaseClient
      .from('registrations')
      .insert([{ name: name, major: major, department: department }]);

    if (error) {
      console.error(error);
      alert('报名失败，请检查控制台！');
    } else {
      alert('报名成功！欢迎加入逐浪智用社！');
      document.getElementById('registerForm').reset(); 
    }
  });
</script>
</body>
</html>
