<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>分类列表 - 逐浪智用社</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .list-container { max-width: 900px; margin: 100px auto 50px auto; padding: 20px; position: relative; z-index: 10; }
        .back-btn { color: #00ffff; text-decoration: none; font-size: 18px; display: inline-block; margin-bottom: 20px; }
        .page-title { color: #fff; text-shadow: 0 0 20px rgba(0, 255, 255, 0.8); text-align: center; margin-bottom: 40px; font-size: 32px; }
        .resource-item { background: rgba(255,255,255,0.05); border-radius: 10px; padding: 20px; margin-bottom: 15px; display: flex; gap: 20px; align-items: center; border-left: 4px solid #00ffff; transition: 0.3s; }
        .resource-item:hover { background: rgba(255,255,255,0.1); transform: translateX(5px); }
         /* 给这个页面单独定制更暗的背景遮罩 */
        body {
            background-color: #050814;
            /* 这里的 0.85 和 0.95 代表遮罩的厚度，数字越大背景越暗 */
            background-image: linear-gradient(rgba(5, 8, 20, 0.85), rgba(5, 8, 20, 0.95)), url('bg.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            margin: 0;
            color: #fff;
            font-family: 'Arial', sans-serif;
        }
    </style>
</head>
<body>
    <div class="list-container">
        <a href="index.html" class="back-btn">← 返回资源大厅</a >
        <h1 id="page-title" class="page-title">加载中...</h1>
        
        <!-- 比赛列表容器 -->
        <ul id="resource-list" style="list-style: none; padding: 0; margin-bottom: 50px;"></ul>
        <!-- 新增：加载更多资源按钮 -->
<div style="text-align: center; margin-bottom: 50px;">
    <button id="load-more-res-btn" onclick="loadMoreResources()" style="display: none; padding: 12px 30px; background: transparent; color: #00ffff; border: 1px solid #00ffff; border-radius: 5px; cursor: pointer; font-weight: bold; box-shadow: 0 0 10px rgba(0,255,255,0.2); transition: 0.3s;">
        加载更多资源 ↓
    </button>
</div>

        <!-- 社员交流与分享区（所有分类均显示） -->
<div id="match-talk-section" style="display: block; margin-top: 50px;">
    <h2 style="color: #00ffff; text-align: center; margin-bottom: 20px; text-shadow: 0 0 10px rgba(0,255,255,0.5);" id="talk-section-title">💡 社员分享与交流区</h2>
    
    <!-- 留言框 -->
    <div style="background: rgba(20, 30, 50, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(0, 255, 255, 0.3); padding: 20px; border-radius: 10px; margin-bottom: 20px;">
        <div style="display: flex; gap: 15px; margin-bottom: 10px;">
            <input type="text" id="talkName" placeholder="你的姓名/昵称" style="width: 50%; padding: 10px; border-radius: 5px; border: 1px solid #555; background: rgba(255,255,255,0.1); color: white;">
            <input type="text" id="talkContact" placeholder="微信号/QQ" style="width: 50%; padding: 10px; border-radius: 5px; border: 1px solid #555; background: rgba(255,255,255,0.1); color: white;">
        </div>
        
        <!-- 新增：资源链接输入框 -->
        <input type="text" id="talkLink" placeholder="分享的资源链接（选填，如：https://...）" style="width: 100%; padding: 10px; margin-bottom: 10px; border-radius: 5px; border: 1px solid #555; background: rgba(255,255,255,0.1); color: white; box-sizing: border-box;">
        
        <textarea id="talkMessage" placeholder="找队友请写清需求，分享资源请写个简介,有其他友善的留言也可以哦~" rows="3" style="width: 100%; padding: 10px; margin-bottom: 10px; border-radius: 5px; border: 1px solid #555; background: rgba(255,255,255,0.1); color: white; box-sizing: border-box;"></textarea>
        
        <button onclick="submitTalk()" style="padding: 10px 20px; background: #00ffff; color: #000; font-weight: bold; border: none; border-radius: 5px; cursor: pointer;">提交发布（需审核）</button>
    </div>

    <!-- 留言展示墙 -->
    <div id="talk-list"></div>
<!-- 新增：加载更多留言按钮 -->
<div style="text-align: center; margin-top: 15px;">
    <button id="load-more-talk-btn" onclick="loadMoreTalks()" style="display: none; padding: 10px 20px; background: transparent; color: #00ffff; border: 1px solid #00ffff; border-radius: 5px; cursor: pointer; font-weight: bold; transition: 0.3s;">
        加载更多交流 ↓
    </button>

</div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const supabaseUrl = window.location.origin + '/supabase';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Impqc2pwcXJnZGNsY3podWprZ3BjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMwNzMxMDMsImV4cCI6MjEwODY0OTEwM30.xvF8oOQOGk4mu3_WlYGEEZxKKs-aLyiunugF6xuJRQw'; // ⚠️ 换成你的
        const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);
        let talkOffset = 0;
        const talkPageSize = 5; // 每次只拉 5 条

        let resOffset = 0;
        const resPageSize = 6; // 每次加载 6 个资源

        const urlParams = new URLSearchParams(window.location.search);
        const category = urlParams.get('cat') || 'ai'; 
        
        const titleMap = { 
            'ai': '🤖 AI 工具导航', 'study': '📚 学习资源分享', 'github': '🐙 GitHub 社群',
            'competition': '🏆 比赛平台', 'seminar': '🎙️ 技术研讨会', 'collab': '🤝 项目协作'
        };
        document.getElementById('page-title').innerText = titleMap[category] || '资源列表';

        // 如果是比赛平台，就把下方的交流区显示出来
        // 根据分类动态改变标题
const talkTitle = document.getElementById('talk-section-title');
if (category === 'competition') {
    talkTitle.innerText = '🤝 组队与交流区';
} else {
    talkTitle.innerText = '💡 社员分享与交流区';
}

// 不管在哪个分类页，都去加载留言
loadTalks();

        // ==========================================
// 1. 加载官方比赛资源（带分页）
// ==========================================


async function loadResources() {
    const { data, error } = await supabaseClient
        .from('resources')
        .select('*')
        .eq('category', category)
        .order('id', { ascending: false }) // 最新的排前面
        .range(resOffset, resOffset + resPageSize - 1); // 核心：分页拉取

    if (error) { console.error(error); return; }

    const list = document.getElementById('resource-list');
    const btn = document.getElementById('load-more-res-btn');

    if (resOffset === 0 && data.length === 0) {
        list.innerHTML = '<p style="color:#888; text-align:center;">这里还空空如也，等待发布~</p >';
        return;
    }

    // 渲染列表
data.forEach(item => {
    const imgUrl = item.cover_url || 'bg.jpg'; 
    const html = `
        <li style="background: rgba(255,255,255,0.05); border-radius: 10px; padding: 15px; margin-bottom: 15px; display: flex; gap: 15px; align-items: center; border-left: 4px solid #00ffff;">
            <img src="${imgUrl}" style="width: 120px; height: 80px; object-fit: cover; border-radius: 8px; background: #000; flex-shrink: 0;">
            <div>
                <a href="resource-detail.html?id=${item.id}" style="font-size: 18px; font-weight: bold; color: #fff; text-decoration: none; display: block; margin-bottom: 5px;">
                    ${item.title} <span style="font-size: 12px; color: #00ffff; margin-left: 10px;">阅读详情 →</span>
                </a > 
                <span style="font-size: 14px; color: #a1a1aa;">${item.desc || '暂无描述'}</span>
            </div>
        </li>
    `;
    list.innerHTML += html;
});

    // 判断是否还有更多数据
    if (data.length < resPageSize) {
        btn.style.display = 'none';
    } else {
        btn.style.display = 'inline-block';
    }
}

// 点击加载更多
function loadMoreResources() {
    resOffset += resPageSize;
    loadResources();
}

// 启动加载
loadResources();

        // 2. 提交组队留言/资源分享
async function submitTalk() {
    const name = document.getElementById('talkName').value;
    const contact = document.getElementById('talkContact').value;
    // ⚠️ 新增：获取资源链接
    const link = document.getElementById('talkLink') ? document.getElementById('talkLink').value : '';
    const message = document.getElementById('talkMessage').value;
    
    if(!name || !message) { alert("请填写名字和留言内容！"); return; }

    // ⚠️ 新增：把链接拼接到内容最前面
    const finalMessage = link ? `【分享链接：${link}】\n${message}` : message;

    const { error } = await supabaseClient.from('match_talk').insert([{ 
        user_name: name, contact: contact, message: finalMessage, status: 'pending' 
    }]);

    if(error) alert("发布失败：" + error.message);
    else {
        alert("发布成功！审核通过后将展示在下方~");
        document.getElementById('talkName').value = '';
        document.getElementById('talkContact').value = '';
        document.getElementById('talkMessage').value = '';
        // ⚠️ 新增：如果有链接框，也一起清空
        if (document.getElementById('talkLink')) document.getElementById('talkLink').value = '';
    }
}

        // 3. 加载已审核的留言
        // ==========================================
// 3. 加载已审核的留言（带分页与折叠）
// ==========================================


async function loadTalks() {
    // 使用 range 进行分页拉取
    const { data, error } = await supabaseClient
        .from('match_talk')
        .select('*')
        .eq('status', 'approved')
        .order('id', { ascending: false })
        .range(talkOffset, talkOffset + talkPageSize - 1); // 核心：分页

    if (error) { console.error(error); return; }

    const list = document.getElementById('talk-list');
    const btn = document.getElementById('load-more-talk-btn');

    // 如果是第一次加载且没有数据
    if (talkOffset === 0 && data.length === 0) {
        list.innerHTML = '<p style="color:#888; text-align:center;">暂无分享内容，快来抢沙发~</p >';
        btn.style.display = 'none';
        return;
    }

    // 如果是第一次加载，清空原本容器；如果是点加载更多，就保留原有内容
    if (talkOffset === 0) {
        list.innerHTML = '';
    }

    // 渲染新拉取的数据
    data.forEach(talk => {
        // 核心：内容折叠，只截取前 30 个字
        const previewText = talk.message.length > 30 ? talk.message.substring(0, 30) + '...' : talk.message;
        
        // 把新卡片追加到列表里
        const cardHtml = `
            <div style="background: rgba(255,255,255,0.05); padding: 15px; border-radius: 10px; margin-bottom: 10px; border-left: 2px solid #00ffff; display: flex; justify-content: space-between; align-items: center;">
                <div style="flex: 1; padding-right: 15px;">
                    <strong style="color: #00ffff; font-size: 15px;">👤 ${talk.user_name}</strong>
                    <p style="color: #d4d4d4; margin-top: 8px; font-size: 14px; margin-bottom: 0; line-height: 1.5;">${previewText}</p >
                </div>
                <a href="talk-detail.html?id=${talk.id}" style="color: #000; background: #00ffff; padding: 6px 12px; border-radius: 5px; text-decoration: none; font-size: 13px; font-weight: bold; white-space: nowrap;">阅读详情 →</a >
            </div>
        `;
        list.insertAdjacentHTML('beforeend', cardHtml);
    });

    // 判断是否还有更多数据
    if (data.length < talkPageSize) {
        btn.style.display = 'none'; // 不够一页，隐藏按钮
    } else {
        btn.style.display = 'inline-block'; // 还有数据，显示按钮
    }
}

// 点击加载更多交流
function loadMoreTalks() {
    talkOffset += talkPageSize; // 偏移量增加
    loadResources();
    loadTalks(); // 重新拉取
    
}
    </script>
</body>
</html>
